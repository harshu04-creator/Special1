<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Special Person Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1 class="title">✨ Special Memories ✨</h1>
            <p class="subtitle">A Collection of Beautiful Moments</p>
        </header>

        <!-- Page Navigation -->
        <nav class="page-nav">
            <button class="nav-btn active" data-page="1">Page 1</button>
            <button class="nav-btn" data-page="2">Page 2</button>
            <button class="nav-btn" data-page="3">Page 3</button>
            <button class="nav-btn" data-page="4">Page 4</button>
            <button class="nav-btn" data-page="5">Page 5</button>
        </nav>

        <!-- Gallery Pages -->
        <div class="gallery-container">
            <!-- Page 1: 20 photos -->
            <div class="gallery-page active" id="page-1">
                <div class="gallery-grid" id="grid-1"></div>
            </div>

            <!-- Page 2: 20 photos -->
            <div class="gallery-page" id="page-2">
                <div class="gallery-grid" id="grid-2"></div>
            </div>

            <!-- Page 3: 20 photos -->
            <div class="gallery-page" id="page-3">
                <div class="gallery-grid" id="grid-3"></div>
            </div>

            <!-- Page 4: 20 photos -->
            <div class="gallery-page" id="page-4">
                <div class="gallery-grid" id="grid-4"></div>
            </div>

            <!-- Page 5: 20 photos -->
            <div class="gallery-page" id="page-5">
                <div class="gallery-grid" id="grid-5"></div>
            </div>
        </div>

        <!-- Page Counter -->
        <div class="page-counter">
            <span class="current-page">1</span> / <span class="total-pages">5</span>
        </div>

        <!-- Arrow Navigation -->
        <div class="arrow-nav">
            <button class="arrow-btn prev-btn" id="prevBtn">
                <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
            </button>
            <button class="arrow-btn next-btn" id="nextBtn">
                <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
            </button>
        </div>
    </div>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox">
        <button class="close-btn" id="closeBtn">×</button>
        <button class="lightbox-arrow prev-arrow" id="prevImage">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
        </button>
        <img src="" alt="Gallery Image" id="lightboxImg">
        <button class="lightbox-arrow next-arrow" id="nextImage">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
        </button>
        <div class="image-counter">
            <span id="currentImageNum">1</span> / <span id="totalImages">100</span>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
