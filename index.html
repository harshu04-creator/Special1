<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Special Person Photo Gallery">
    <meta name="author" content="Your Name">
    <title>Special Person Gallery</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #8b5cf6, #a855f7, #c026d3, #e879f9, #fbbf24, #fcd34d);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            min-height: 100vh;
            overflow-x: hidden;
        }

        @keyframes gradientShift {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            animation: fadeInDown 1s ease;
        }

        .title {
            font-size: 3.5rem;
            color: #fff;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.3);
            margin-bottom: 10px;
            font-weight: 700;
        }

        .subtitle {
            font-size: 1.3rem;
            color: #fff;
            opacity: 0.9;
            font-weight: 300;
            letter-spacing: 2px;
        }

        .page-nav {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .nav-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.4);
            color: #fff;
            padding: 12px 28px;
            font-size: 1rem;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            font-weight: 600;
        }

        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        .nav-btn.active {
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            border-color: #fbbf24;
            box-shadow: 0 8px 25px rgba(251, 191, 36, 0.4);
        }

        .gallery-container {
            position: relative;
            min-height: 600px;
        }

        .gallery-page {
            display: none;
            animation: fadeIn 0.5s ease;
        }

        .gallery-page.active {
            display: block;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            padding: 20px;
        }

        .gallery-item {
            position: relative;
            overflow: hidden;
            border-radius: 20px;
            cursor: pointer;
            aspect-ratio: 1;
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.3), rgba(251, 191, 36, 0.3));
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .gallery-item:hover {
            transform: scale(1.05) rotate(2deg);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            z-index: 10;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .gallery-item:hover img {
            transform: scale(1.1);
        }

        .gallery-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.4), rgba(251, 191, 36, 0.4));
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 1;
        }

        .gallery-item:hover::before {
            opacity: 1;
        }

        .gallery-item::after {
            content: '🔍';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 3rem;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 2;
        }

        .gallery-item:hover::after {
            opacity: 1;
        }

        .page-counter {
            text-align: center;
            margin-top: 30px;
            font-size: 1.5rem;
            color: #fff;
            font-weight: 600;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .arrow-nav {
            position: fixed;
            top: 50%;
            left: 0;
            right: 0;
            transform: translateY(-50%);
            display: flex;
            justify-content: space-between;
            pointer-events: none;
            padding: 0 20px;
            z-index: 100;
        }

        .arrow-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.4);
            color: #fff;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            pointer-events: all;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .arrow-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.1);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        .arrow-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .lightbox.active {
            display: flex;
            animation: fadeIn 0.3s ease;
        }

        .lightbox img {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
            border-radius: 10px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .close-btn {
            position: absolute;
            top: 30px;
            right: 40px;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: #fff;
            font-size: 3rem;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            line-height: 1;
        }

        .close-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: rotate(90deg);
        }

        .lightbox-arrow {
            position: absolute;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.4);
            color: #fff;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .lightbox-arrow:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.1);
        }

        .prev-arrow {
            left: 40px;
        }

        .next-arrow {
            right: 40px;
        }

        .image-counter {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-size: 1.5rem;
            font-weight: 600;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 30px;
            border-radius: 50px;
            backdrop-filter: blur(10px);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            .title {
                font-size: 2.5rem;
            }

            .subtitle {
                font-size: 1rem;
            }

            .gallery-grid {
                grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
                gap: 10px;
                padding: 10px;
            }

            .nav-btn {
                padding: 10px 20px;
                font-size: 0.9rem;
            }

            .arrow-btn {
                width: 50px;
                height: 50px;
            }

            .lightbox-arrow {
                width: 50px;
                height: 50px;
            }

            .prev-arrow {
                left: 20px;
            }

            .next-arrow {
                right: 20px;
            }
        }

        @media (max-width: 480px) {
            .gallery-grid {
                grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            }

            .title {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1 class="title">✨ Special Memories ✨</h1>
            <p class="subtitle">A Collection of Beautiful Moments</p>
        </header>

        <nav class="page-nav">
            <button class="nav-btn active" data-page="1">Page 1</button>
            <button class="nav-btn" data-page="2">Page 2</button>
            <button class="nav-btn" data-page="3">Page 3</button>
            <button class="nav-btn" data-page="4">Page 4</button>
            <button class="nav-btn" data-page="5">Page 5</button>
        </nav>

        <div class="gallery-container">
            <div class="gallery-page active" id="page-1">
                <div class="gallery-grid" id="grid-1"></div>
            </div>

            <div class="gallery-page" id="page-2">
                <div class="gallery-grid" id="grid-2"></div>
            </div>

            <div class="gallery-page" id="page-3">
                <div class="gallery-grid" id="grid-3"></div>
            </div>

            <div class="gallery-page" id="page-4">
                <div class="gallery-grid" id="grid-4"></div>
            </div>

            <div class="gallery-page" id="page-5">
                <div class="gallery-grid" id="grid-5"></div>
            </div>
        </div>

        <div class="page-counter">
            <span class="current-page">1</span> / <span class="total-pages">5</span>
        </div>

        <div class="arrow-nav">
            <button class="arrow-btn prev-btn" id="prevBtn">
                <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
            </button>
            <button class="arrow-btn next-btn" id="nextBtn">
                <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
            </button>
        </div>
    </div>

    <div class="lightbox" id="lightbox">
        <button class="close-btn" id="closeBtn">×</button>
        <button class="lightbox-arrow prev-arrow" id="prevImage">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
        </button>
        <img src="" alt="Gallery Image" id="lightboxImg">
        <button class="lightbox-arrow next-arrow" id="nextImage">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
        </button>
        <div class="image-counter">
            <span id="currentImageNum">1</span> / <span id="totalImages">100</span>
        </div>
    </div>

    <script>
        const totalPhotos = 100;
        const photosPerPage = 20;
        const totalPages = 5;
        const photos = [];

        for (let i = 1; i <= totalPhotos; i++) {
            photos.push(`images/photo${i}.jpg`);
        }

        function populateGallery() {
            for (let page = 1; page <= totalPages; page++) {
                const grid = document.getElementById(`grid-${page}`);
                const startIndex = (page - 1) * photosPerPage;
                const endIndex = startIndex + photosPerPage;

                for (let i = startIndex; i < endIndex && i < totalPhotos; i++) {
                    const item = document.createElement('div');
                    item.className = 'gallery-item';
                    item.dataset.index = i;

                    const img = document.createElement('img');
                    img.src = photos[i];
                    img.alt = `Photo ${i + 1}`;
                    img.loading = 'lazy';

                    item.appendChild(img);
                    grid.appendChild(item);
                    item.addEventListener('click', () => openLightbox(i));
                }
            }
        }

        let currentPage = 1;

        function showPage(pageNum) {
            document.querySelectorAll('.gallery-page').forEach(page => {
                page.classList.remove('active');
            });

            document.getElementById(`page-${pageNum}`).classList.add('active');

            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            document.querySelector(`[data-page="${pageNum}"]`).classList.add('active');

            document.querySelector('.current-page').textContent = pageNum;

            document.getElementById('prevBtn').disabled = pageNum === 1;
            document.getElementById('nextBtn').disabled = pageNum === totalPages;

            currentPage = pageNum;
        }

        document.querySelectorAll('.nav-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const pageNum = parseInt(btn.dataset.page);
                showPage(pageNum);
            });
        });

        document.getElementById('prevBtn').addEventListener('click', () => {
            if (currentPage > 1) {
                showPage(currentPage - 1);
            }
        });

        document.getElementById('nextBtn').addEventListener('click', () => {
            if (currentPage < totalPages) {
                showPage(currentPage + 1);
            }
        });

        document.addEventListener('keydown', (e) => {
            if (!document.getElementById('lightbox').classList.contains('active')) {
                if (e.key === 'ArrowLeft' && currentPage > 1) {
                    showPage(currentPage - 1);
                } else if (e.key === 'ArrowRight' && currentPage < totalPages) {
                    showPage(currentPage + 1);
                }
            }
        });

        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightboxImg');
        let currentImageIndex = 0;

        function openLightbox(index) {
            currentImageIndex = index;
            lightboxImg.src = photos[index];
            lightbox.classList.add('active');
            document.body.style.overflow = 'hidden';
            updateImageCounter();
        }

        function closeLightbox() {
            lightbox.classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        function updateImageCounter() {
            document.getElementById('currentImageNum').textContent = currentImageIndex + 1;
            document.getElementById('totalImages').textContent = totalPhotos;
        }

        function showNextImage() {
            currentImageIndex = (currentImageIndex + 1) % totalPhotos;
            lightboxImg.src = photos[currentImageIndex];
            updateImageCounter();
        }

        function showPrevImage() {
            currentImageIndex = (currentImageIndex - 1 + totalPhotos) % totalPhotos;
            lightboxImg.src = photos[currentImageIndex];
            updateImageCounter();
        }

        document.getElementById('closeBtn').addEventListener('click', closeLightbox);
        document.getElementById('nextImage').addEventListener('click', showNextImage);
        document.getElementById('prevImage').addEventListener('click', showPrevImage);

        lightbox.addEventListener('click', (e) => {
            if (e.target === lightbox) {
                closeLightbox();
            }
        });

        document.addEventListener('keydown', (e) => {
            if (lightbox.classList.contains('active')) {
                if (e.key === 'Escape') {
                    closeLightbox();
                } else if (e.key === 'ArrowRight') {
                    showNextImage();
                } else if (e.key === 'ArrowLeft') {
                    showPrevImage();
                }
            }
        });

        let touchStartX = 0;
        let touchEndX = 0;

        lightbox.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
        });

        lightbox.addEventListener('touchend', (e) => {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        });

        function handleSwipe() {
            if (touchEndX < touchStartX - 50) {
                showNextImage();
            }
            if (touchEndX > touchStartX + 50) {
                showPrevImage();
            }
        }

        populateGallery();
        showPage(1);
    </script>
</body>
</html>
